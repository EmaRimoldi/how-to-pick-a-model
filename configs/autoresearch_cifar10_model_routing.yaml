experiment:
  name: autoresearch_cifar10_model_routing
  steps: 24
  visibility_regime: top1_only
  feedback_condition: ca
  candidate_generation: single
  selection_policy: top1
  prompt_template: autoresearch_single_trajectory_program.txt
  branch_timeout_seconds: 1800
  incorrect_penalty: -1.0
benchmark:
  id: autoresearch_cifar10
  template_path: benchmarks/autoresearch_cifar10/solution_template.py
  profiles:
    - autoresearch_cifar10
output:
  root: runs/autoresearch_cifar10/model_routing
models:
  include:
    - gpt_5_4_mini
    - gpt_5_3_codex
    - gpt_5_3_codex_spark
    - claude_sonnet
