experiment:
  name: autoresearch_cifar10_model_routing_smoke
  steps: 1
  visibility_regime: top1_only
  feedback_condition: ca
  candidate_generation: single
  selection_policy: top1
  prompt_template: autoresearch_program.txt
  branch_timeout_seconds: 240
  incorrect_penalty: -1.0
  success_relative_improvement_threshold: 0.05
  stop_on_success: false
benchmark:
  id: autoresearch_cifar10
  template_path: benchmarks/autoresearch_cifar10/solution_template.py
  profiles:
    - autoresearch_cifar10
output:
  root: runs/autoresearch_cifar10/model_routing_smoke
models:
  include:
    - gpt_5_4_mini
    - gpt_5_3_codex
    - gpt_5_3_codex_spark
    - claude_sonnet
