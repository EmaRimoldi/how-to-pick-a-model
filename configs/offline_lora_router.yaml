local_lora_router:
  dataset: artifacts/phase4_teacher_routing_dataset.jsonl
  base_model: distilbert-base-uncased
  output_dir: training/offline_routing_student_lora
  summary_out: artifacts/offline_lora_router_summary.json
  predictions_out: artifacts/offline_lora_router_predictions.json
  seed: 5105
  dev_fraction: 0.25
  max_source_chars: 12000
  max_length: 384
  epochs: 4
  batch_size: 2
  learning_rate: 0.0003
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.0
  target_modules: [q_lin, v_lin]
