models:
  local_stub:
    adapter: local_stub
    model_id: local-stub-v1
    temperature: 0.0
    timeout_seconds: 30
  leakage_probe:
    adapter: leakage_probe
    model_id: leakage-probe-v1
    temperature: 0.0
    timeout_seconds: 30
  routing_student:
    adapter: routing_student
    model_id: routing-student-v1
    model_path: training/phase5_routing_student/model.pkl
    max_source_chars: 12000
    temperature: 0.0
    timeout_seconds: 30
  claude_haiku:
    adapter: claude_haiku
    model_id: haiku
    transport: cli
    edit_protocol: structured_edits
    temperature: 0.2
    timeout_seconds: 240
    max_budget_usd: 0.25
    max_tokens_distribution: 2048
    max_tokens_edit: 4096
    retries: 1
  claude_haiku_diff_legacy:
    adapter: claude_haiku
    model_id: haiku
    transport: cli
    edit_protocol: patch_unified_diff
    temperature: 0.2
    timeout_seconds: 240
    max_budget_usd: 0.25
    max_tokens_distribution: 2048
    max_tokens_edit: 12000
    retries: 1
  claude_opus_teacher:
    adapter: claude_haiku
    model_id: opus
    transport: cli
    edit_protocol: structured_edits
    temperature: 0.2
    timeout_seconds: 360
    max_budget_usd: 1.2
    max_tokens_distribution: 2048
    max_tokens_edit: 4096
    retries: 1
  claude_opus_teacher_replacement_legacy:
    adapter: claude_haiku
    model_id: opus
    transport: cli
    edit_protocol: replacement_file
    temperature: 0.2
    timeout_seconds: 360
    max_budget_usd: 2.0
    max_tokens_distribution: 2048
    max_tokens_edit: 12000
    retries: 1
  strong_claude:
    adapter: claude_code
    model_id: claude-opus-current
    temperature: 0.3
    timeout_seconds: 180
  mid_claude:
    adapter: claude_code
    model_id: claude-haiku-current
    temperature: 0.3
    timeout_seconds: 180
  weak_qwen:
    adapter: openai_compatible
    model_id: Qwen/Qwen3-Coder-Next
    base_url: http://localhost:8000/v1
    temperature: 0.3
    timeout_seconds: 180
