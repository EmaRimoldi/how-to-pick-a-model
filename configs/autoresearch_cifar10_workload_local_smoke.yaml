experiment:
  name: autoresearch_cifar10_workload_local_smoke
  steps: 2
  visibility_regime: top1_only
  feedback_condition: ca
  candidate_generation: batched
  selection_policy: top1
  branch_timeout_seconds: 300
  incorrect_penalty: -1.0
  success_relative_improvement_threshold: 0.05
  stop_on_success: false
benchmark:
  id: autoresearch_cifar10
  template_path: benchmarks/autoresearch_cifar10/workloads/cnn_compact.py
  profiles:
    - autoresearch_cifar10
  instance_overrides:
    workloads:
      - cnn_compact
    families:
      - cnn_compact
    train_subset_size: 50000
    val_subset_size: 10000
    max_train_steps: 2
    seed: 123
output:
  root: runs/autoresearch_cifar10/workload_local_smoke
models:
  include:
    - autoresearch_local_stub
