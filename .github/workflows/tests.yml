name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --dev --frozen
      - run: uv run python scripts/maintenance/workflow.py check
      - name: Ensure generated navigation is committed
        run: git diff --exit-code -- docs/audits
      - name: Audit recorded recovery evidence without model calls
        run: >-
          uv run python scripts/analyze_recovery_validation.py
          --input experiments/humaneval-plus/context-value/results/validation-20261022
          --output /tmp/recovery-evidence-audit
      - name: Reproduce the recorded MBPP+ and forecast reports
        run: >-
          uv run python scripts/analyze_recovery_transfer.py
          --input experiments/mbpp-plus/context-value-transfer/results/replication-20261022
          --forecasts experiments/mbpp-plus/context-value-transfer/results/replication-20261022/semantic-control
          --expected-analysis experiments/mbpp-plus/context-value-transfer/results/replication-20261022/analysis.json
          --output /tmp/mbpp-evidence-audit
      - name: Verify the complete BigCodeBench bank and frozen comparisons
        run: >-
          uv run python scripts/verify_feedback_evidence.py
          --input experiments/bigcodebench/feedback-only-routing/results/fixed-policies-20261022
      - name: Audit the saved trace-retention engineering banks
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/trace-retention-20261027/reproduce_analysis.py
      - name: Audit frozen public diagnostic snapshots and matched prompts
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/acquisition-preparation-20261027/reproduce.py
      - name: Reproduce the complete spectrum screen and its failed criterion
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/spectrum-screen-20261030/reproduce.py
      - name: Reproduce every cell of the retrospective spectrum audit
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/spectrum-posthoc-20261030/reproduce.py
      - name: Verify public-only ablation projections and prospective source-screen provenance
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/spectrum-ablation-preparation-20261030/reproduce.py
      - name: Audit new bounded components and all qualification observations
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/development-ablation-components/reproduce.py
      - name: Audit the original tokenizer package and its controlled diagnostic inputs
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/development-package-black13/reproduce.py
      - name: Re-tokenize full repair artifacts and matched prompts offline
        run: >-
          uv run experiments/python-repair/checkpoint-environment/results/token-capacity-20261030/reproduce.py
      - name: Verify source metadata, ZIP directories and prospective development groups
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/fixeval-source-access-20261030/reproduce.py
      - name: Rescore all whole-program qualification cases and preserve exclusions
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/fixeval-source-qualification-20261030/reproduce.py
      - name: Reproduce public whole-program F/N/S projections and instrumentation comparison
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/stdin-ablation-preparation-20261030/reproduce.py
      - name: Verify prospective stdin pilot roster, call order, capacity and budget arithmetic
        run: uv run python scripts/prepare_stdin_pilot.py --check
      - name: Reproduce interrupted stdin pilot evidence without model calls
        run: >-
          uv run python experiments/python-repair/checkpoint-environment/results/stdin-pilot-20261030/reproduce.py
