[project]
name = "vao-query-optimization"
version = "0.1.0"
description = "Experimental framework for verifiable agentic optimization on stateful query-engine editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "tqdm",
    "rich",
    "transformers",
    "datasets>=5.0.0",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
vao-run = "vao.orchestrator:main"
vao-verify = "vao.verifier:main"
vao-estimators = "vao.analysis.compute_estimators:main"
vao-validate-run = "vao.validate_run:main"
vao-phase3-summary = "vao.analysis.phase3_summary:main"
vao-phase35-compare = "vao.analysis.phase35_compare:main"
vao-run-diagnostics-visuals = "vao.analysis.run_diagnostics_visuals:main"
vao-edit-protocol-debug = "vao.analysis.edit_protocol_debug:main"
vao-oracle-family-pilot = "vao.analysis.oracle_family_pilot:main"
vao-task-mode-decomposition = "vao.analysis.task_mode_decomposition:main"
vao-task-mode-threshold-sweep = "vao.analysis.task_mode_threshold_sweep:main"
vao-task-mode-robustness = "vao.analysis.task_mode_robustness:main"
vao-task-mode-bootstrap = "vao.analysis.task_mode_bootstrap:main"
vao-oracle-family-campaign-plan = "vao.analysis.oracle_family_campaign_plan:main"
vao-oracle-family-multimodel-visuals = "vao.analysis.oracle_family_multimodel_visuals:main"
vao-oracle-family-latent-modes = "vao.analysis.oracle_family_latent_modes:main"
vao-oracle-family-iterative = "vao.analysis.oracle_family_iterative:main"
vao-oracle-family-policy-compare = "vao.analysis.oracle_family_policy_compare:main"
vao-autoresearch-cifar10-pilot = "vao.analysis.autoresearch_cifar10_pilot:main"
vao-autoresearch-cifar10-mode-catalog = "vao.analysis.autoresearch_cifar10_mode_catalog:main"
vao-autoresearch-cifar10-single-trajectory = "vao.analysis.autoresearch_cifar10_single_trajectory_campaign:main"
vao-swebench-download = "vao.swebench_orchestration.download:main"
vao-swebench-meta-prompt = "vao.swebench_orchestration.prompt:main"
vao-swebench-execute = "vao.swebench_orchestration.executor:main"
vao-swebench-analyze = "vao.swebench_orchestration.analyze:main"
vao-swebench-evaluate = "vao.swebench_orchestration.evaluate:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vao*", "benchmarks*"]

[tool.setuptools.package-data]
benchmarks = ["stateful_query_engine/metadata/*.json", "autoresearch_cifar10/metadata/*.json"]
vao = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
