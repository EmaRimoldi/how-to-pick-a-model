[project]
name = "how-to-pick-a-model"
version = "0.1.0"
description = "Verifiable-task benchmarks for cost-aware model and continuation decisions"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Worker-model and verifier dependencies are optional for saved-data audits.
continuation-pilot = [
    "evalplus==0.3.1",
]
other-experiments = [
    "evalplus>=0.3.1",
    "lifelines>=0.30",
    "openai>=2.0",
    "scipy>=1.15",
    "torch>=2.7",
    "tqdm>=4.67",
    "transformers>=5.0",
]
all-experiments = [
    "evalplus>=0.3.1",
    "lifelines>=0.30",
    "openai>=2.0",
    "scipy>=1.15",
    "torch>=2.7",
    "tqdm>=4.67",
    "transformers>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

# Run offline checks with: uv run python scripts/maintenance/workflow.py check
